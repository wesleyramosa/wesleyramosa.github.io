<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Finanças ME + Casa</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#000;--card:#121314;--ink:#eceef0;--muted:#8a949b;--line:#26292c;
  --brand:#000;--brand2:#4285f4;
  --green:#34a853;--red:#ea4335;--amber:#f2a900;--blue:#4285f4;--purple:#9b72e0;
  --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--brand);color:var(--ink);border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;display:flex;align-items:center;gap:12px;color:var(--ink)}
.top h1 img{height:34px;width:auto}
.top h1 span{padding-left:12px;border-left:1px solid var(--line);font-weight:600}
.top select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
.top select option{color:#000}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1200px;margin:10px auto 0;scrollbar-width:none}
nav a{color:var(--muted);text-decoration:none;padding:9px 12px;border-radius:8px 8px 0 0;white-space:nowrap;font-size:14px}
nav a.on{background:var(--bg);color:var(--ink);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.cards.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.cards.c5 .val{font-size:21px}
@media (max-width:1100px){.cards.c5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.cards.c5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
a.card{color:inherit;text-decoration:none;cursor:pointer;transition:transform .12s}
a.card:hover{transform:translateY(-2px)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--brand2))}
.card .lbl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.card .val{font-size:24px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.card .det{font-size:12.5px;color:var(--muted)}
.pos{color:var(--green)}.neg{color:var(--red)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:15px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--green)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.anual td,.anual th{padding:6px 8px;font-size:13px;white-space:nowrap}
.anual td:first-child,.anual th:first-child{position:sticky;left:0;background:var(--card)}
.anual tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.btn{border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--brand2);color:#fff}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 9px;font-size:13px;font-weight:500}
.btn.danger{background:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;cursor:pointer;border:0;font-family:inherit}
.pill.ok{background:#1a8f5a22;color:var(--green)}
.pill.pend{background:#c98a1226;color:var(--amber)}
.pill.late{background:#c83a3a22;color:var(--red)}
.icon{background:none;border:0;cursor:pointer;color:var(--muted);font-size:15px;padding:2px 5px}
.empty{color:var(--muted);text-align:center;padding:24px}
dialog{border:0;border-radius:14px;padding:0;width:min(440px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:18px}
dialog h3{margin:0 0 12px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.f input,.f select,input.in,select.in{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.alert{background:#c98a121c;border:1px solid #c98a1244;color:var(--ink);padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#16211c;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.nuvem{font-size:12.5px;color:var(--muted);white-space:nowrap}
.nuvem.erro{color:var(--red)}
.login{max-width:380px;margin:8vh auto 0}
.login .msg{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}
.login a{color:var(--brand2);font-size:14px;cursor:pointer}
body.deslogado nav,body.deslogado #selAno,body.deslogado #selMes{display:none}
.chartbox{position:relative;height:260px}
.catbar{display:grid;grid-template-columns:120px 1fr 90px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.catbar .bar{margin:0}
</style>
</head>
<body class="deslogado">
<header>
  <div class="top">
    <h1><img src="logo.png" alt="W2A"><span>Finanças ME + Casa</span></h1>
    <select id="selAno" aria-label="Ano"></select>
    <select id="selMes" aria-label="Mês"></select>
    <span id="nuvem" class="nuvem"></span>
    <button class="btn sec sm" id="bSair" hidden>Sair</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>

<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<div class="toast" id="toast"></div>

<script>
// ---------- configuração ----------
const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_L=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const GRUPOS={
  entrada:{nome:'Entradas',icone:'💰',cor:'var(--green)',desc:'Faturamento da empresa (ME)',cats:['Clientes','Outras receitas']},
  contador:{nome:'Contador',icone:'🧾',cor:'var(--blue)',desc:'Honorários e serviços contábeis',cats:['Honorários mensais','13º honorário','Serviços extras']},
  imposto:{nome:'Impostos',icone:'🏛️',cor:'var(--purple)',desc:'Simples Nacional e outros tributos',cats:['Simples Nacional (DAS)','Pró-labore','INSS / GPS','ISS','IRPF','Taxas e alvarás','Outros']},
  divida:{nome:'Dívidas',icone:'💳',cor:'var(--red)',desc:'Dívidas da empresa — separadas das contas mensais',cats:[]},
  empresa:{nome:'Saídas da empresa',icone:'🏢',cor:'var(--amber)',desc:'Pró-labore e outras despesas da ME',cats:['Pró-labore','Indicação','Loja virtual','Ferramentas / softwares','Outros']},
  renda:{nome:'Renda da casa',icone:'🏠',cor:'var(--brand2)',desc:'Salário (pró-labore), VR e outras rendas',cats:['Salário','VR','Outras rendas']},
  pessoal:{nome:'Despesas pessoais',icone:'🛒',cor:'var(--red)',desc:'Gastos da casa e da família',cats:['Moradia','Dívidas + cartão','Internet + Gás','Supermercado','Transporte','Açougue','Feira','Padaria','Dízimo','Investimento','Médico | Farmácia','Gasto pessoal','Barbeiro','Ração','Outros']},
};
const KEY='financas-me-casa-v1';
const hoje=new Date();

// ---------- estado ----------
let db=load();
let ano=+(localStorage.getItem(KEY+':ano')||hoje.getFullYear());
let mes=+(localStorage.getItem(KEY+':mes')??hoje.getMonth()+1); // 0 = ano todo
let charts=[];

function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.lancs)return d}catch(e){}
  return {lancs:[],config:{metaFat:7500,metaPessoal:6000,clientes:[]}};
}
const clientes=()=>db.config.clientes||(db.config.clientes=[]);
// dívidas: saldo inicial num mês; cada lançamento pago com div=id abate o saldo
const dividas=()=>db.config.dividas||(db.config.dividas=[]);
const TIPOS_DIV={empresa:'Empresa',casa:'Casa'};
const tipoDiv=d=>d.tipo==='casa'?'casa':'empresa';
const abat=(d,f)=>soma(db.lancs.filter(l=>l.div===d.id&&l.pago&&f(l)));
const saldoAntes=(d,mm)=>mm<=d.inicio?d.valor:d.valor-abat(d,l=>l.mes<mm);
const fimDoPeriodo=()=>mes?mk(ano,mes):mk(ano,12);
const inicioDoPeriodo=()=>mes?mk(ano,mes):mk(ano,1);
const catsExtras=g=>{const c=db.config.cats||(db.config.cats={});return c[g]||(c[g]=[])};
const catsDe=g=>g==='entrada'?[...clientes().map(c=>c.nome),'Outras receitas',...catsExtras(g)]:g==='divida'?Object.values(TIPOS_DIV):[...GRUPOS[g].cats,...catsExtras(g)];
const parseValor=v=>parseFloat(String(v).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.'));
// cria categoria pelo próprio formulário; em Entradas vira cliente e em Dívidas vira dívida
function novaCategoria(g,mesForm){
  const rotulo=g==='entrada'?'Nome do novo cliente':g==='divida'?'Nome da nova dívida (ex.: Carro)':'Nome da nova categoria';
  const nome=(prompt(rotulo)||'').trim();if(!nome)return null;
  if(catsDe(g).some(c=>c.toLowerCase()===nome.toLowerCase())){toast('Já existe: '+nome);return catsDe(g).find(c=>c.toLowerCase()===nome.toLowerCase())}
  if(g==='entrada'){const v=parseValor(prompt('Mensalidade de '+nome+' (R$) — deixe em branco se não for mensal')||'');if(!isNaN(v)&&v>0)clientes().push({nome,valor:v,dia:''});else catsExtras(g).push(nome)}
  else catsExtras(g).push(nome);
  save();toast(g==='divida'?'Dívida cadastrada':'Categoria criada');return nome;
}
// abatimentos antigos (lançados em Contador/Impostos) passam para o grupo Dívidas
function migrar(){
  dividas().forEach(d=>{if(!d.tipo)d.tipo='empresa'});
  db.lancs.forEach(l=>{
    if(l.div&&l.grupo!=='divida')l.grupo='divida';
    if(l.grupo==='divida'){const d=dividas().find(x=>x.id===l.div);l.cat=d?TIPOS_DIV[tipoDiv(d)]:(l.cat==='Casa'?'Casa':'Empresa')}
  });
}
const tipoLanc=l=>l.cat==='Casa'?'casa':'empresa';
migrar();
function save(){
  migrar();
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
  agendarEnvio();
}

// ---------- login e salvamento na nuvem ----------
const API='https://financas-api.cortecerto-app.workers.dev/api';
let token=localStorage.getItem(KEY+':token')||'';
let logado=false,envioTimer=0,enviando=false,pendente=false;
async function api(caminho,opts={}){
  const r=await fetch(API+caminho,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&token){sairLocal('Sua sessão expirou. Entre de novo.');throw new Error('401')}
  if(!r.ok)throw new Error(j.erro||'Erro de conexão');
  return j;
}
function nuvem(txt,erro){const el=document.getElementById('nuvem');el.textContent=txt;el.classList.toggle('erro',!!erro)}
function agendarEnvio(){
  if(!logado)return;
  pendente=true;nuvem('Salvando…');clearTimeout(envioTimer);envioTimer=setTimeout(enviar,700);
}
async function enviar(){
  if(enviando){envioTimer=setTimeout(enviar,500);return}
  enviando=true;pendente=false;
  try{await api('/dados',{method:'PUT',body:JSON.stringify(db)});if(!pendente)nuvem('☁️ Salvo')}
  catch(e){if(logado){pendente=true;nuvem('⚠️ Sem conexão — tentando de novo',true);clearTimeout(envioTimer);envioTimer=setTimeout(enviar,8000)}}
  enviando=false;
}
window.addEventListener('beforeunload',e=>{if(pendente){e.preventDefault();e.returnValue=''}});
async function entrar(){
  logado=true;document.body.classList.remove('deslogado');bSair.hidden=false;nuvem('Carregando…');
  try{
    const d=await api('/dados');
    if(d&&Array.isArray(d.lancs)){db={lancs:d.lancs,config:d.config||{}};localStorage.setItem(KEY,JSON.stringify(db));nuvem('☁️ Salvo')}
    else if(db.lancs.length||clientes().length||dividas().length){await enviar();toast('Seus dados deste navegador foram enviados para a nuvem')} // 1º acesso: sobe o que já existia
    else nuvem('☁️ Salvo');
  }catch(e){if(!logado)return;nuvem('⚠️ Sem conexão — mostrando a cópia deste aparelho',true)}
  migrar();montarTopo();render();
}
function sairLocal(msg){
  logado=false;token='';localStorage.removeItem(KEY+':token');localStorage.removeItem(KEY);
  db={lancs:[],config:{metaFat:7500,metaPessoal:6000,clientes:[]}};pendente=false;clearTimeout(envioTimer);
  telaLogin(msg);
}
bSair.onclick=async()=>{
  if(pendente){nuvem('Salvando…');await enviar()}
  if(pendente&&!confirm('Há alterações que ainda não foram salvas na nuvem. Sair mesmo assim?'))return;
  try{await api('/sair',{method:'POST'})}catch(e){}
  sairLocal();
};
async function telaLogin(msg,modo){
  logado=false;document.body.classList.add('deslogado');bSair.hidden=true;nuvem('');
  charts.forEach(c=>c.destroy());charts=[];
  if(!modo){try{modo=(await api('/status')).temSenha?'entrar':'criar'}catch(e){modo='entrar'}}
  const criar=modo==='criar';
  app.innerHTML=`<div class="panel login"><h2>${criar?'Criar senha':'Entrar'}</h2>
  <p class="sub">${criar?'Use o código de acesso que está no arquivo <b>codigo-de-acesso.txt</b> na pasta financas-dados da sua Área de Trabalho.':'Acesso restrito ao dono do sistema.'}</p>
  <form id="fLogin">
    <label class="f">E-mail<input class="in" name="email" type="email" autocomplete="username" required></label>
    ${criar?`<label class="f">Código de acesso<input class="in" name="codigo" autocomplete="off" required></label>`:''}
    <label class="f">${criar?'Nova senha (mín. 8 caracteres)':'Senha'}<input class="in" name="senha" type="password" autocomplete="${criar?'new-password':'current-password'}" minlength="${criar?8:1}" required></label>
    ${criar?`<label class="f">Repita a senha<input class="in" name="senha2" type="password" autocomplete="new-password" required></label>`:''}
    <button class="btn" style="width:100%;margin-top:16px">${criar?'Criar senha e entrar':'Entrar'}</button>
    <div class="msg" id="lMsg">${esc(msg||'')}</div>
  </form>
  <a id="lTroca">${criar?'Já tenho senha — entrar':'Esqueci a senha / primeiro acesso'}</a></div>`;
  lTroca.onclick=()=>telaLogin('',criar?'entrar':'criar');
  fLogin.onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(fLogin);const b=fLogin.querySelector('button');
    if(criar&&fd.get('senha')!==fd.get('senha2')){lMsg.textContent='As senhas não conferem.';return}
    b.disabled=true;lMsg.textContent='';
    try{
      const r=await api(criar?'/definir-senha':'/login',{method:'POST',body:JSON.stringify({email:fd.get('email'),senha:fd.get('senha'),codigo:(fd.get('codigo')||'').trim().toUpperCase()})});
      token=r.token;localStorage.setItem(KEY+':token',token);await entrar();
    }catch(err){lMsg.textContent=err.message;b.disabled=false}
  };
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=(a,m)=>a+'-'+String(m).padStart(2,'0');
const fmtData=d=>d?d.split('-').reverse().join('/'):'';
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}

// filtros
const doPeriodo=l=>mes?l.mes===mk(ano,mes):l.mes.startsWith(ano+'-');
const doMes=(a,m)=>l=>l.mes===mk(a,m);
const soma=(arr)=>arr.reduce((s,l)=>s+(+l.valor||0),0);
const de=(g,f=doPeriodo)=>db.lancs.filter(l=>l.grupo===g&&f(l));
function status(l){
  if(l.pago)return 'ok';
  if(l.venc&&l.venc<hoje.toISOString().slice(0,10))return 'late';
  return 'pend';
}
const STATUS_TXT={ok:'Pago',pend:'Pendente',late:'Atrasado'};

// ---------- topo ----------
function montarTopo(){
  const anos=new Set([hoje.getFullYear(),hoje.getFullYear()+1,...db.lancs.map(l=>+l.mes.slice(0,4))]);
  selAno.innerHTML=[...anos].sort().map(a=>`<option ${a===ano?'selected':''}>${a}</option>`).join('');
  selMes.innerHTML=`<option value="0">Ano todo</option>`+MESES_L.map((m,i)=>`<option value="${i+1}" ${i+1===mes?'selected':''}>${m}</option>`).join('');
}
selAno.onchange=()=>{ano=+selAno.value;localStorage.setItem(KEY+':ano',ano);render()};
selMes.onchange=()=>{mes=+selMes.value;localStorage.setItem(KEY+':mes',mes);render()};

const ABAS=[['painel','Painel'],['entrada','Entradas'],['pessoal','Despesas pessoais'],['contador','Contador'],['imposto','Impostos'],['divida','Dívidas'],['empresa','Saídas da empresa'],['renda','Renda da casa'],['anual','Visão anual'],['backup','Backup']];
function rota(){return (location.hash||'#painel').slice(1)}
function montarNav(){nav.innerHTML=ABAS.map(([k,n])=>`<a href="#${k}" class="${rota()===k?'on':''}">${n}</a>`).join('')}

// ---------- painel ----------
const rendaDaEmpresa=()=>db.config.rendaDaEmpresa||['Salário'];
const ehRepasse=l=>l.grupo==='renda'&&rendaDaEmpresa().includes(l.cat);
// pró-labore em "Saídas da empresa" já aparece como Salário na casa; não conta duas vezes
const empSemProlabore=l=>l.cat!=='Pró-labore';
function resumo(f){
  const ent=soma(de('entrada',f)),cont=soma(de('contador',f)),imp=soma(de('imposto',f)),emp=soma(de('empresa',f)),divE=soma(de('divida',f).filter(l=>tipoLanc(l)==='empresa')),divC=soma(de('divida',f).filter(l=>tipoLanc(l)==='casa'));
  const ren=soma(de('renda',f)),pes=soma(de('pessoal',f)),rep=soma(de('renda',f).filter(ehRepasse)),empOutras=soma(de('empresa',f).filter(empSemProlabore));
  return {ent,cont,imp,emp,empOutras,divE,divC,ren,rep,pes,resEmp:ent-rep-cont-imp-empOutras-divE,resCasa:ren-pes-divC};
}
function painel(){
  const r=resumo(doPeriodo);
  const per=mes?`${MESES_L[mes-1]} de ${ano}`:`Ano de ${ano}`;
  const meta=(db.config.metaFat||0)*(mes?1:12);
  const pctMeta=meta?Math.min(100,r.ent/meta*100):0;
  const pend=db.lancs.filter(l=>doPeriodo(l)&&!l.pago&&l.grupo!=='entrada'&&l.grupo!=='renda').sort((a,b)=>(a.venc||'9').localeCompare(b.venc||'9'));
  const aReceber=db.lancs.filter(l=>doPeriodo(l)&&!l.pago&&l.grupo==='entrada');
  const pctImp=r.ent?(r.imp/r.ent*100):0;
  let h=`<h2>Painel</h2><p class="sub">${per} · clique em um card para ver e lançar</p>`;
  if(!db.lancs.length)h+=`<div class="alert">Nenhum dado ainda. Comece lançando uma entrada, ou vá em <a href="#backup">Backup</a> para importar o arquivo com os dados da sua planilha.</div>`;
  else if(meta&&r.ent<meta)h+=`<div class="alert">⚠️ Faturamento abaixo da meta mínima de ${brl(meta)}. Regra: <b>não ter gasto pessoal antes de pagar carro e casa.</b></div>`;
  h+=`<div class="cards c5">

function cardTipoDiv(tipo){
  const ini=inicioDoPeriodo(),fim=fimDoPeriodo();
  const ds=dividas().filter(d=>tipoDiv(d)===tipo&&d.inicio<=fim);
  const antes=ds.reduce((s,d)=>s+saldoAntes(d,ini),0),noPer=ds.reduce((s,d)=>s+abat(d,l=>l.mes>=ini&&l.mes<=fim&&l.mes>=d.inicio),0),depois=antes-noPer;
  const total=ds.reduce((s,d)=>s+d.valor,0),pct=total?Math.min(100,(total-depois)/total*100):0;
  const prox=mes&&mes<12?`${MESES[mes]}/${ano}`:`Jan/${ano+1}`;
  return `<a class="card" href="#divida" style="--c:var(--red)"><div class="lbl">💳 Dívidas da ${tipo}</div>
    <div class="val ${antes?'neg':''}">${brl(antes)}</div><div class="det">${ds.length?`${ds.length} dívida(s) · início ${mes?`de ${MESES[mes-1]}`:'do ano'}`:'Nenhuma dívida'}</div>
    ${ds.length?`<div class="bar"><i style="width:${pct}%"></i></div><div class="det">${noPer?`Abatido <b class="pos">${brl(noPer)}</b> · `:''}${prox} começa com <b>${brl(depois)}</b></div>`:''}</a>`;
}
function cardsDividas(filtro){
  const ds=dividas().filter(d=>!filtro||tipoDiv(d)===filtro).filter(d=>d.inicio<=fimDoPeriodo());
  if(!ds.length)return filtro?'':`<div class="row" style="margin:-4px 0 18px"><span class="sub" style="margin:0">Sem dívidas cadastradas.</span><button class="btn sec sm" data-div-novo="empresa">+ Dívida</button></div>`;
  const ini=inicioDoPeriodo(),fim=fimDoPeriodo();
  const linhas=ds.map(d=>{
    const antes=saldoAntes(d,ini),noPer=abat(d,l=>l.mes>=ini&&l.mes<=fim&&l.mes>=d.inicio),depois=antes-noPer;
    const pctPago=d.valor?Math.min(100,(d.valor-depois)/d.valor*100):0;
    const prox=mes===12?`Jan/${ano+1}`:mes?`${MESES[mes]}/${ano}`:`Jan/${ano+1}`;
    return {d,antes,noPer,depois,html:`<a class="card" href="#divida" style="--c:var(--red)"><div class="lbl">💳 ${TIPOS_DIV[tipoDiv(d)]} — ${esc(d.nome)}</div>
      <div class="val neg">${brl(antes)}</div><div class="det">Saldo no início ${mes?`de ${MESES[mes-1]}`:'do ano'}</div>
      <div class="bar"><i style="width:${pctPago}%"></i></div>
      <div class="det">${noPer?`Abatido: <b class="pos">${brl(noPer)}</b> · `:'Nada abatido ainda · '}${prox} começa com <b>${brl(depois)}</b></div></a>`};
  });
  const totA=linhas.reduce((s,x)=>s+x.antes,0),totD=linhas.reduce((s,x)=>s+x.depois,0);
  return `<div class="cards">${linhas.map(x=>x.html).join('')}
    ${linhas.length>1?`<div class="card" style="--c:var(--red)"><div class="lbl">💳 Total de dívidas</div><div class="val neg">${brl(totA)}</div><div class="det">Início ${mes?`de ${MESES[mes-1]}`:'do ano'} → fim: <b>${brl(totD)}</b></div></div>`:''}</div>`;
}
function painelDividas(){

function card(g,v,det){const G=GRUPOS[g];return `<a class="card" href="#${g}" style="--c:${G.cor}"><div class="lbl">${G.icone} ${G.nome}</div><div class="val">${brl(v)}</div><div class="det">${det}</div></a>`}
const pctTxt=(a,b)=>b?(a/b*100).toFixed(0)+'%':'—';
function pendTxt(g){const p=de(g).filter(l=>!l.pago);return p.length?`${p.length} pendente(s)`:'tudo pago'}
function catBars(g){
  const ls=de(g);const tot=soma(ls);if(!tot)return '<div class="empty">Sem lançamentos no período</div>';
  const por={};ls.forEach(l=>por[l.cat]=(por[l.cat]||0)+(+l.valor||0));
  const arr=Object.entries(por).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);const max=arr[0][1];
  return arr.map(([c,v])=>`<div class="catbar"><span>${esc(c)}</span><div class="bar"><i style="width:${v/max*100}%;background:var(--red)"></i></div><span class="n" style="text-align:right">${brl(v)} <small style="color:var(--muted)">${(v/tot*100).toFixed(0)}%</small></span></div>`).join('');
}
function graficoAno(){

    {label:'Entradas',data:rs.map(r=>r.ent),backgroundColor:'#1a8f5a'},
    {label:'Contador + impostos',data:rs.map(r=>r.cont+r.imp),backgroundColor:'#7b4fc4'},
    {label:'Despesas pessoais',data:rs.map(r=>r.pes),backgroundColor:'#c83a3a'},
  ]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:cor,boxWidth:12}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+brl(c.raw)}}},scales:{x:{ticks:{color:cor}},y:{ticks:{color:cor,callback:v=>'R$ '+(v/1000)+'k'}}}}}));

function lancarMensalidades(mm){
  let n=0;
  clientes().forEach(c=>{
    if(db.lancs.some(l=>l.grupo==='entrada'&&l.cat===c.nome&&l.mes===mm))return;
    const dia=Math.min(+c.dia||0,new Date(+mm.slice(0,4),+mm.slice(5),0).getDate());
    db.lancs.push({id:uid(),grupo:'entrada',cat:c.nome,desc:'Mensalidade',valor:+c.valor,mes:mm,venc:dia?mm+'-'+String(dia).padStart(2,'0'):'',pago:false});n++;
  });
  save();render();toast(`${n} mensalidade(s) lançada(s) como "a receber"`);
}

    if(e.submitter?.value!=='ok')return;
    const fd=new FormData(frm);
    const valor=parseFloat(String(fd.get('valor')).replace(/\./g,'').replace(',','.'));
    if(isNaN(valor)){e.preventDefault();toast('Valor inválido');return}
    const base={grupo:g,cat:fd.get('cat'),desc:fd.get('desc').trim(),valor,mes:fd.get('mes'),venc:fd.get('venc'),pago:!!fd.get('pago'),div:g==='divida'&&fd.get('div')!=='__nova'?fd.get('div')||'':''};
    if(novo){
      const meses=[base.mes];
      if(fd.get('repetir')){let [a,m]=base.mes.split('-').map(Number);while(m<12){m++;meses.push(mk(a,m))}}
      meses.forEach((mm,i)=>{
        const venc=base.venc&&i?mk(+mm.slice(0,4),+mm.slice(5))+base.venc.slice(7):base.venc;
        db.lancs.push({...base,id:uid(),mes:mm,venc,pago:i?false:base.pago});
        if(g==='empresa'&&base.cat==='Pró-labore'&&fd.get('espelho'))db.lancs.push({grupo:'renda',cat:'Salário',desc:'Pró-labore',valor,mes:mm,venc:'',pago:i?false:base.pago,id:uid()});
      });
      const nm=mm=>MESES[+mm.slice(5)-1]+'/'+mm.slice(0,4);
      toast(meses.length>1?`${meses.length} lançamentos criados (${nm(meses[0])} a ${nm(meses.at(-1))})`:`Lançamento salvo em ${nm(base.mes)}`);
    }else{Object.assign(l,base);toast('Alterações salvas')}
    // se foi lançado em outro mês, abre esse mês para o lançamento aparecer na tela
    if(!doPeriodo(base)){ano=+base.mes.slice(0,4);mes=+base.mes.slice(5);localStorage.setItem(KEY+':ano',ano);localStorage.setItem(KEY+':mes',mes);montarTopo()}
    save();render();
  };
  dlg.showModal();
}

// ---------- visão anual (igual à planilha) ----------
function anual(){
  const tabela=(titulo,blocos,resultado)=>{
    let rows='';const totRes=Array(13).fill(0);
    blocos.forEach(([g,sinal,soCat,rotulo])=>{
      const G=GRUPOS[g];const cats=soCat?[].concat(soCat):[...new Set(catsDe(g).concat(db.lancs.filter(l=>l.grupo===g).map(l=>l.cat)))];
      const totG=Array(13).fill(0);
      cats.forEach(c=>{
        const vals=MESES.map((_,i)=>soma(db.lancs.filter(l=>l.grupo===g&&l.cat===c&&l.mes===mk(ano,i+1))));
        const t=vals.reduce((a,b)=>a+b,0);if(!t)return;
        vals.push(t);vals.forEach((v,i)=>{totG[i]+=v;totRes[i]+=sinal*v});
        rows+=`<tr><td>${esc(c)}</td>${vals.map(v=>`<td class="n">${v?brl(v):'—'}</td>`).join('')}</tr>`;
      });
      rows+=`<tr class="tot"><td>${rotulo||G.icone+' '+G.nome+(typeof soCat==='string'?' ('+soCat.toLowerCase()+')':'')}</td>${totG.map(v=>`<td class="n">${brl(v)}</td>`).join('')}</tr>`;
    });
    rows+=`<tr class="tot"><td>${resultado}</td>${totRes.map(v=>`<td class="n ${v<0?'neg':'pos'}">${brl(v)}</td>`).join('')}</tr>`;
    return `<div class="panel scroll"><h3>${titulo}</h3><table class="anual"><thead><tr><th></th>${MESES.map(m=>`<th class="n">${m}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  };
  app.innerHTML=`<h2>Visão anual ${ano}</h2><p class="sub">Mesmo formato da planilha: categorias × meses</p>
  ${tabela('🏢 Empresa (ME) — fontes de renda',[['entrada',1],['renda',-1,rendaDaEmpresa(),'🏠 Para a casa'],['contador',-1],['imposto',-1],['divida',-1,'Empresa'],
    ['empresa',-1,[...new Set(catsDe('empresa').concat(db.lancs.filter(l=>l.grupo==='empresa').map(l=>l.cat)))].filter(empSemProlabore),'🏢 Outras saídas da empresa']],'Resultado final')}
  ${tabela('🏠 Casa',[['renda',1],['pessoal',-1],['divida',-1,'Casa']],'Resultado do mês')}`;
}

// ---------- backup ----------
function backup(){
  app.innerHTML=`<h2>Backup e configurações</h2><p class="sub">Tudo o que você altera é salvo automaticamente na nuvem e aparece em qualquer aparelho em que você entrar. O backup é uma cópia extra de segurança.</p>
  <div class="panel"><h3>Backup</h3><div class="row">
    <button class="btn" id="bExp">⬇️ Exportar backup (.json)</button>
    <label class="btn sec" style="cursor:pointer">⬆️ Importar backup<input type="file" id="bImp" accept=".json,application/json" hidden></label>
    <button class="btn sec" id="bCsv">Exportar CSV (Excel)</button>
  </div><p class="sub" style="margin-top:10px">Importar <b>substitui</b> os dados atuais (também na nuvem). ${db.lancs.length} lançamento(s) salvos agora.</p></div>
  <div class="panel"><h3>Categorias que você criou</h3>${Object.entries(db.config.cats||{}).filter(([,v])=>v.length).map(([g,v])=>`<p style="margin:6px 0"><b>${GRUPOS[g]?.nome||g}:</b> ${v.map((c,i)=>`<span class="pill pend" style="margin:2px">${esc(c)} <button class="icon" style="padding:0 2px" data-cat-del="${g}|${i}" title="Remover">✕</button></span>`).join('')}</p>`).join('')||'<p class="sub" style="margin:0">Nenhuma ainda. Para criar, escolha "➕ Cadastrar nova categoria…" no campo Categoria de qualquer lançamento.</p>'}</div>
  <div class="panel"><h3>O que a casa recebe da empresa</h3><p class="sub" style="margin:0 0 8px">As categorias marcadas da Renda da casa são descontadas do Resultado da empresa.</p>
    ${catsDe('renda').map(c=>`<label class="chk" style="margin-top:6px"><input type="checkbox" data-rde="${esc(c)}" ${rendaDaEmpresa().includes(c)?'checked':''}> ${esc(c)}</label>`).join('')}</div>
  <div class="panel"><h3>Metas</h3>
    <div class="row"><label class="f" style="flex:1">Faturamento mínimo mensal (R$)<input class="in" id="cMeta" value="${String(db.config.metaFat||'').replace('.',',')}"></label>
    <label class="f" style="flex:1">Teto de despesas pessoais/mês (R$)<input class="in" id="cTeto" value="${String(db.config.metaPessoal||'').replace('.',',')}"></label></div>
    <button class="btn" id="cSalvar" style="margin-top:12px">Salvar metas</button></div>
  <div class="panel"><h3>Zona de perigo</h3><button class="btn danger" id="bZerar">Apagar todos os dados</button></div>`;
  bExp.onclick=()=>baixar(`financas-backup-${hoje.toISOString().slice(0,10)}.json`,JSON.stringify(db,null,1),'application/json');
  bCsv.onclick=()=>{
    const linhas=[['Grupo','Categoria','Descrição','Mês','Vencimento','Valor','Pago']].concat(db.lancs.map(l=>[GRUPOS[l.grupo]?.nome,l.cat,l.desc,l.mes,l.venc,String(l.valor).replace('.',','),l.pago?'Sim':'Não']));
    baixar('financas.csv','﻿'+linhas.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv');
  };
  bImp.onchange=async()=>{
    try{const d=JSON.parse(await bImp.files[0].text());
      if(d.juntar||(!d.lancs&&d.config)){ // arquivo parcial (clientes, dívidas, lançamentos): junta sem apagar nada
        (d.config?.clientes||[]).forEach(c=>{if(!clientes().some(x=>x.nome===c.nome))clientes().push(c)});
        (d.config?.dividas||[]).forEach(x=>{if(!dividas().some(y=>y.id===x.id))dividas().push(x)});
        (d.lancs||[]).forEach(l=>{if(!db.lancs.some(y=>y.id===l.id))db.lancs.push(l)});
        save();montarTopo();toast('Dados adicionados');location.hash='#painel';render();return}
      if(!Array.isArray(d.lancs))throw 0;
      if(!confirm(`Importar ${d.lancs.length} lançamentos? Os dados atuais deste navegador serão substituídos.`))return;
      d.lancs.forEach(l=>l.id=l.id||uid());db={lancs:d.lancs,config:{...db.config,...d.config}};save();montarTopo();toast('Backup importado');location.hash='#painel';
    }catch(e){toast('Arquivo inválido')}
  };
  app.querySelectorAll('[data-rde]').forEach(cb=>cb.onchange=()=>{db.config.rendaDaEmpresa=[...app.querySelectorAll('[data-rde]:checked')].map(x=>x.dataset.rde);save();toast('Salvo')});
  cSalvar.onclick=()=>{const n=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0;db.config.metaFat=n(cMeta.value);db.config.metaPessoal=n(cTeto.value);save();toast('Metas salvas')};
  bZerar.onclick=()=>{if(confirm('Apagar TODOS os lançamentos (também na nuvem)? Exporte um backup antes.')){db={lancs:[],config:db.config};save();render()}};
}
function baixar(nome,txt,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

// ---------- ações ----------
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-novo],[data-ed],[data-del],[data-pay],[data-dup],[data-cli-novo],[data-cat-del],[data-cli-ed],[data-cli-del],[data-lancar],[data-div-novo],[data-div-ed],[data-div-del],[data-abater]');if(!t)return;
  const div=id=>dividas().find(d=>d.id===id);
  if(t.dataset.divNovo)return formDivida(t.dataset.divNovo);
  if(t.dataset.divEd){const d=div(t.dataset.divEd);return formDivida(tipoDiv(d),d)}
  if(t.dataset.divDel){const d=div(t.dataset.divDel);if(confirm(`Remover a dívida "${d.nome}"? Os pagamentos lançados continuam como despesa normal.`)){db.config.dividas=dividas().filter(x=>x!==d);db.lancs.forEach(l=>{if(l.div===d.id)l.div=''});save();render()}return}
  if(t.dataset.abater){const d=div(t.dataset.abater);return form('divida',null,{cat:TIPOS_DIV[tipoDiv(d)],div:d.id,desc:'Abatimento',pago:true})}
  if(t.dataset.catDel){const [g,i]=t.dataset.catDel.split('|');const c=catsExtras(g)[+i];if(confirm(`Remover a categoria "${c}"? Os lançamentos que já usam ela continuam.`)){catsExtras(g).splice(+i,1);save();render()}return}
  if(t.dataset.cliNovo)return formCliente();
  if(t.dataset.cliEd)return formCliente(+t.dataset.cliEd);
  if(t.dataset.cliDel){const c=clientes()[+t.dataset.cliDel];if(confirm(`Remover ${c.nome} da lista de clientes? Os lançamentos já feitos continuam.`)){clientes().splice(+t.dataset.cliDel,1);save();render()}return}
  if(t.dataset.lancar)return lancarMensalidades(t.dataset.lancar);
  const find=id=>db.lancs.find(l=>l.id===id);
  if(t.dataset.novo)t.dataset.novo==='divida'&&!dividas().length?formDivida('empresa'):form(t.dataset.novo);
  if(t.dataset.ed){const l=find(t.dataset.ed);form(l.grupo,l)}
  if(t.dataset.pay){const l=find(t.dataset.pay);l.pago=!l.pago;save();render()}
  if(t.dataset.dup){const l=find(t.dataset.dup);let [a,m]=l.mes.split('-').map(Number);m++;if(m>12){m=1;a++}
    db.lancs.push({...l,id:uid(),mes:mk(a,m),venc:l.venc?mk(a,m)+l.venc.slice(7):'',pago:false});save();toast(`Copiado para ${MESES[m-1]}/${a}`);render()}
  if(t.dataset.del&&confirm('Excluir este lançamento?')){db.lancs=db.lancs.filter(l=>l.id!==t.dataset.del);save();render()}
});

function render(){
  if(!logado)return;
  montarNav();const r=rota();
  if(r==='painel')painel();else if(GRUPOS[r])lista(r);else if(r==='anual')anual();else if(r==='backup')backup();else painel();
  if(r!=='painel'){charts.forEach(c=>c.destroy());charts=[]}
}
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});
montarTopo();
if(token)entrar();else telaLogin();
</script>
